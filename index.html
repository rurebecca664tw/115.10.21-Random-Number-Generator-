<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#f5f7f2">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@300&display=swap" rel="stylesheet">
	<title>課堂抽籤機</title>
	<style>
		/* 全頁色彩與尺寸設定，維持投影時的高對比與大字級。 */
		:root {
			color-scheme: light;
			--ink: #172b2a;
			--muted: #687976;
			--line: #dce5df;
			--paper: #ffffff;
			--canvas: #f3f6f1;
			--green: #176b58;
			--green-dark: #105443;
			--mint: #dff1e9;
			--coral: #e66c4e;
			--sun: #f2c65e;
			--shadow: 0 18px 50px rgba(23, 43, 42, 0.08);
			font-family: "Chiron GoRound TC", sans-serif;
			font-weight: 300;
			font-synthesis: none;
			text-rendering: optimizeLegibility;
		}

		* { box-sizing: border-box; }

		body {
			min-width: 320px;
			min-height: 100vh;
			margin: 0;
			color: var(--ink);
			background-color: var(--canvas);
			background-image: radial-gradient(#dfe8df 0.8px, transparent 0.8px);
			background-size: 18px 18px;
		}

		button, input, textarea { font: inherit; }
		button { color: inherit; }

		.app-shell {
			width: min(1440px, 100%);
			margin: 0 auto;
			padding: 28px clamp(16px, 3vw, 42px) 48px;
		}

		.topbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 20px;
			margin-bottom: 24px;
		}

		.brand { display: flex; align-items: center; gap: 14px; }
		.masthead-line {
			display: flex;
			min-width: 0;
			flex: 1 1 auto;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
		}

		.sound-toggle-button {
			display: inline-flex;
			min-height: 42px;
			flex: 0 0 auto;
			align-items: center;
			justify-content: center;
			gap: 7px;
			padding: 0 12px;
			border: 1px solid var(--line);
			border-radius: 10px;
			color: var(--green-dark);
			background: #fff;
			cursor: pointer;
			font-size: 14px;
			font-weight: 300;
		}

		.sound-toggle-button[aria-pressed="false"] { color: var(--muted); background: #f1f3f0; }
		.sound-toggle-icon { font-size: 18px; line-height: 1; }

		.brand-mark {
			display: grid;
			width: 48px;
			height: 48px;
			place-items: center;
		}
		.brand-mark-image { width: auto; max-width: 48px; height: 48px; object-fit: contain; transform: translate(3px, 10px) scale(1.5); }

		h1 { margin: 0; font-size: 25px; line-height: 1.2; }
		h1, .mode-button, .group-source-button, .draw-button, #stage-mode-label {
			font-family: "Zen Maru Gothic", sans-serif;
		}
		h1, #stage-mode-label { font-weight: 900; }
		.brand p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

		.mode-switch {
			display: inline-flex;
			gap: 4px;
			padding: 5px;
			border: 1px solid var(--line);
			border-radius: 14px;
			background: rgba(255, 255, 255, 0.78);
		}

		.mode-button {
			min-height: 42px;
			padding: 0 14px;
			border: 0;
			border-radius: 10px;
			color: var(--muted);
			background: transparent;
			cursor: pointer;
			font-size: 15px;
			font-weight: 900;
		}

		.mode-button[aria-pressed="true"] {
			color: var(--green-dark);
			background: var(--mint);
		}

		.workspace {
			display: grid;
			grid-template-columns: minmax(300px, 370px) minmax(0, 1fr);
			align-items: start;
			gap: 22px;
		}

		.control-panel, .stage, .history-panel {
			border: 1px solid rgba(220, 229, 223, 0.9);
			border-radius: 18px;
			background: var(--paper);
			box-shadow: var(--shadow);
		}

		.control-panel { width: 100%; min-width: 0; padding: 24px; }
		.panel-heading { margin: 0 0 20px; font-size: 18px; }
		.field { margin-bottom: 21px; }
		.settings-summary {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			list-style: none;
			cursor: pointer;
		}

		.settings-summary::-webkit-details-marker { display: none; }
		.settings-summary .panel-heading { margin: 0 0 20px; }
		.settings-chevron {
			width: 11px;
			height: 11px;
			margin: -8px 4px 0 0;
			border-right: 2px solid var(--muted);
			border-bottom: 2px solid var(--muted);
			transform: rotate(45deg);
			transition: transform 150ms ease;
		}

		details[open] > .settings-summary .settings-chevron { transform: rotate(225deg); }
		.settings-content, .settings-content > * { min-width: 0; }

		.field-label, .field-label-row {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 10px;
			margin-bottom: 9px;
			font-size: 15px;
			font-weight: 300;
		}

		.field-hint { color: var(--muted); font-size: 12px; font-weight: 300; }

		.range-entry {
			display: grid;
			grid-template-columns: minmax(0, 1fr) 20px minmax(0, 1fr) auto;
			align-items: center;
			gap: 8px;
		}

		.range-entry span { color: var(--muted); text-align: center; }

		.text-input, .number-input, .name-list {
			width: 100%;
			min-width: 0;
			max-width: 100%;
			border: 1px solid #cbd8d0;
			border-radius: 10px;
			outline: none;
			color: var(--ink);
			background: #fff;
			font-size: 16px;
			transition: border-color 140ms ease, box-shadow 140ms ease;
		}

		.text-input, .number-input { min-height: 46px; padding: 0 12px; }
		.text-input:focus, .number-input:focus, .name-list:focus {
			border-color: var(--green);
			box-shadow: 0 0 0 3px rgba(23, 107, 88, 0.13);
		}

		.add-range-button {
			width: 46px;
			height: 46px;
			border: 0;
			border-radius: 10px;
			color: #fff;
			background: var(--green);
			cursor: pointer;
			font-size: 25px;
			line-height: 1;
		}

		.range-list { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }

		.range-chip {
			display: inline-flex;
			align-items: center;
			gap: 7px;
			padding: 5px 7px 5px 11px;
			border: 1px solid #cce4d8;
			border-radius: 999px;
			color: var(--green-dark);
			background: #eff8f3;
			font-size: 14px;
			font-weight: 300;
		}

		.chip-remove {
			display: grid;
			width: 24px;
			height: 24px;
			place-items: center;
			border: 0;
			border-radius: 50%;
			color: var(--green-dark);
			background: transparent;
			cursor: pointer;
			font-size: 18px;
		}

		.chip-remove:hover { background: #dcefe5; }

		.name-list {
			min-height: 142px;
			padding: 12px;
			resize: vertical;
			line-height: 1.65;
		}

		.group-strategies {
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: 6px;
			padding: 4px;
			border: 1px solid var(--line);
			border-radius: 11px;
			background: #f6f8f5;
		}

		.group-source-switch {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 6px;
			padding: 4px;
			border: 1px solid var(--line);
			border-radius: 11px;
			background: #f6f8f5;
		}

		.group-source-button {
			min-height: 42px;
			padding: 5px 8px;
			border: 0;
			border-radius: 8px;
			color: var(--muted);
			background: transparent;
			cursor: pointer;
			font-size: 14px;
			font-weight: 900;
		}

		.group-source-button[aria-pressed="true"] {
			color: var(--green-dark);
			background: #fff;
			box-shadow: 0 1px 4px rgba(23, 43, 42, 0.12);
		}

		.strategy-button {
			min-height: 42px;
			padding: 5px 3px;
			border: 0;
			border-radius: 8px;
			color: var(--muted);
			background: transparent;
			cursor: pointer;
			font-size: 12px;
			font-weight: 300;
		}

		.strategy-button[aria-pressed="true"] {
			color: var(--green-dark);
			background: #fff;
			box-shadow: 0 1px 4px rgba(23, 43, 42, 0.12);
		}

		.group-results {
			display: grid;
			width: 100%;
			grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr));
			align-content: center;
			gap: 14px;
		}

		.group-card {
			min-width: 0;
			padding: 17px;
			border: 1px solid #d5e7dc;
			border-top: 5px solid var(--green);
			border-radius: 12px;
			background: rgba(255, 255, 255, 0.94);
			box-shadow: 0 8px 20px rgba(23, 43, 42, 0.07);
		}

		.group-card:nth-child(3n + 2) { border-top-color: var(--coral); }
		.group-card:nth-child(3n) { border-top-color: #d5a82e; }

		.group-card-heading {
			display: flex;
			align-items: baseline;
			justify-content: space-between;
			gap: 8px;
			margin-bottom: 12px;
		}

		.group-card-heading h3 { margin: 0; font-size: 19px; }
		.group-card-heading span { color: var(--muted); font-size: 12px; }

		.group-members { display: grid; gap: 7px; margin: 0 0 15px; padding: 0; list-style: none; }

		.group-member {
			display: flex;
			min-width: 0;
			align-items: center;
			justify-content: space-between;
			gap: 8px;
			padding: 8px 9px;
			border: 1px solid transparent;
			border-radius: 8px;
			background: #f5f8f5;
			font-size: 16px;
			font-weight: 300;
		}

		.group-member-photo {
			width: 42px;
			height: 42px;
			flex: 0 0 auto;
			border: 1px solid #d7ebe0;
			border-radius: 50%;
			object-fit: cover;
		}

		.group-member.is-leader {
			border-color: #e3bf58;
			background: #fff3c9;
			box-shadow: inset 4px 0 0 #d5a82e;
		}

		.member-name { min-width: 0; overflow-wrap: anywhere; }
		.member-tags { display: inline-flex; flex: 0 0 auto; align-items: center; gap: 5px; }

		.gender-badge {
			padding: 3px 7px;
			border-radius: 999px;
			color: #47665a;
			background: #e5eee8;
			font-size: 11px;
			font-weight: 300;
		}

		.leader-badge {
			padding: 3px 7px;
			border-radius: 999px;
			color: #7f4b08;
			background: #ffedb7;
			font-size: 11px;
			font-weight: 300;
		}

		.group-leader-button, .all-leaders-button {
			min-height: 42px;
			border: 1px solid #cdded3;
			border-radius: 9px;
			color: var(--green-dark);
			background: #fff;
			cursor: pointer;
			font-size: 14px;
			font-weight: 300;
		}

		.group-leader-button { width: 100%; }
		.group-leader-button:hover, .all-leaders-button:hover { background: #eff7f2; }

		.all-leaders-button {
			display: block;
			width: 100%;
			margin-top: 16px;
			border: 0;
			color: #fff;
			background: var(--coral);
			font-size: 16px;
		}

		.all-leaders-button:hover { background: #cc573b; }
		.all-leaders-button[hidden] { display: none; }

		.quantity-row { display: flex; align-items: center; gap: 12px; }
		.quantity-row .number-input { width: 108px; font-size: 20px; font-weight: 300; text-align: center; }
		.quantity-caption { color: var(--muted); font-size: 14px; }

		.switch-row {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 14px;
			padding: 14px 0;
			border-top: 1px solid #edf1ed;
			border-bottom: 1px solid #edf1ed;
		}

		.switch-copy strong { display: block; font-size: 15px; }
		.switch-copy small { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }

		.toggle {
			position: relative;
			flex: 0 0 auto;
			width: 52px;
			height: 30px;
		}

		.toggle input { position: absolute; width: 1px; height: 1px; opacity: 0; }

		.toggle-track {
			position: absolute;
			inset: 0;
			border-radius: 20px;
			background: #cbd5cf;
			cursor: pointer;
			transition: background 150ms ease;
		}

		.toggle-track::after {
			position: absolute;
			top: 4px;
			left: 4px;
			width: 22px;
			height: 22px;
			border-radius: 50%;
			background: #fff;
			box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
			content: "";
			transition: transform 150ms ease;
		}

		.toggle input:checked + .toggle-track { background: var(--green); }
		.toggle input:checked + .toggle-track::after { transform: translateX(22px); }
		.toggle input:focus-visible + .toggle-track { outline: 3px solid rgba(23, 107, 88, 0.3); outline-offset: 3px; }

		.draw-button {
			display: flex;
			width: 100%;
			min-height: 62px;
			align-items: center;
			justify-content: center;
			gap: 11px;
			margin-top: 20px;
			border: 0;
			border-radius: 13px;
			color: #fff;
			background: var(--green);
			box-shadow: 0 8px 18px rgba(23, 107, 88, 0.2);
			cursor: pointer;
			font-size: 20px;
			font-weight: 900;
			transition: background 140ms ease, transform 140ms ease;
		}

		.draw-button:hover { background: var(--green-dark); transform: translateY(-1px); }
		.draw-button:disabled { cursor: wait; opacity: 0.72; transform: none; }
		.draw-button[hidden] { display: none !important; }
		.draw-icon { font-size: 23px; }

		.available-count {
			margin: 13px 0 0;
			color: var(--green-dark);
			font-size: 14px;
			font-weight: 300;
			text-align: center;
		}

		.error-message {
			margin: 12px 0 0;
			padding: 10px 12px;
			border: 1px solid #f0c2b5;
			border-radius: 9px;
			color: #9c3824;
			background: #fff3ef;
			font-size: 14px;
			line-height: 1.5;
		}

		.error-message[hidden] { display: none; }

		.stage-column { min-width: 0; }

		.stage {
			position: relative;
			display: flex;
			min-height: 510px;
			flex-direction: column;
			overflow: hidden;
			padding: clamp(24px, 4vw, 52px);
			background:
				radial-gradient(ellipse at 90% 4%, rgba(242, 198, 94, 0.18), transparent 26%),
				radial-gradient(ellipse at 0% 100%, rgba(69, 169, 131, 0.12), transparent 32%),
				#fff;
		}

		.stage-topline {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 16px;
			color: var(--muted);
			font-size: 14px;
			font-weight: 300;
		}

		.live-indicator { display: inline-flex; align-items: center; gap: 8px; }
		.live-dot { width: 9px; height: 9px; border-radius: 50%; background: #49a879; }

		.result-area {
			display: grid;
			flex: 1;
			min-height: 360px;
			align-content: center;
			justify-items: center;
			padding: 34px 0;
		}

		.result-placeholder { color: #aab7b0; text-align: center; }
		.placeholder-symbol { display: block; margin-bottom: 14px; color: #75a78e; font-size: 62px; line-height: 1; }
		.placeholder-title { margin: 0; color: var(--ink); font-size: clamp(25px, 3vw, 38px); font-weight: 300; }
		.placeholder-copy { margin: 9px 0 0; font-size: 16px; }

		.result-grid {
			display: flex;
			width: 100%;
			flex-wrap: wrap;
			align-items: center;
			justify-content: center;
			gap: clamp(12px, 2vw, 24px);
		}

		.result-tile {
			display: grid;
			width: clamp(130px, 18vw, 220px);
			min-height: clamp(130px, 18vw, 220px);
			place-items: center;
			padding: 14px;
			border: 2px solid #d7ebe0;
			border-radius: 24px;
			color: var(--green-dark);
			background: #f1f9f4;
			box-shadow: 0 12px 28px rgba(23, 107, 88, 0.1);
			font-size: clamp(46px, 8vw, 100px);
			font-weight: 300;
			line-height: 1;
			overflow-wrap: anywhere;
			text-align: center;
			animation: reveal 360ms cubic-bezier(0.2, 0.8, 0.25, 1.15) both;
		}

		.result-tile.name-tile { width: min(100%, 340px); min-height: 120px; font-size: clamp(28px, 4vw, 48px); }
		.result-tile.has-image {
			display: flex;
			min-height: 220px;
			flex-direction: column;
			justify-content: center;
			gap: 10px;
			font-size: 32px;
			line-height: 1.2;
		}
		.result-tile.name-tile.has-image { min-height: 240px; font-size: 24px; }
		.result-tile-image {
			width: min(100%, 150px);
			aspect-ratio: 1;
			border: 2px solid #d7ebe0;
			border-radius: 50%;
			object-fit: cover;
		}
		.result-grid.is-spinning .result-tile { color: #81978c; background: #f7faf7; animation: spin-flash 140ms ease-in-out infinite alternate; }

		@keyframes reveal {
			from { opacity: 0; transform: translateY(15px) scale(0.86) rotate(-2deg); }
			to { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
		}

		@keyframes spin-flash { from { transform: translateY(-3px); } to { transform: translateY(3px); } }

		.stage-footer {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			padding-top: 18px;
			border-top: 1px solid #e8eee9;
			color: var(--muted);
			font-size: 13px;
		}

		.history-panel { margin-top: 18px; padding: 20px 24px; }

		.history-heading {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			margin-bottom: 14px;
		}

		.history-actions { display: flex; align-items: center; gap: 8px; }

		.history-heading h2 { margin: 0; font-size: 17px; }

		.reset-button {
			min-height: 38px;
			padding: 0 12px;
			border: 1px solid #d6e0da;
			border-radius: 9px;
			color: #465b53;
			background: #fff;
			cursor: pointer;
			font-size: 13px;
			font-weight: 300;
		}

		.reset-button:hover { border-color: #b5c7bc; background: #f7faf7; }
		.reset-button:disabled { cursor: not-allowed; opacity: 0.45; }
		.history-empty { margin: 0; padding: 10px 0; color: var(--muted); font-size: 14px; }

		.history-list { display: grid; gap: 8px; max-height: 250px; overflow: auto; }

		.history-item {
			display: grid;
			grid-template-columns: 105px 1fr;
			align-items: baseline;
			gap: 14px;
			padding: 10px 12px;
			border-radius: 9px;
			background: #f6f8f5;
		}

		.history-time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
		.history-values { font-size: 15px; font-weight: 300; overflow-wrap: anywhere; }

		.visually-hidden {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			margin: -1px;
			overflow: hidden;
			clip: rect(0, 0, 0, 0);
			white-space: nowrap;
			border: 0;
		}

		#confetti-canvas { position: fixed; inset: 0; z-index: 5; width: 100%; height: 100%; pointer-events: none; }

		@media (max-width: 850px) {
			.workspace { grid-template-columns: minmax(0, 1fr); }
			.control-panel { order: 2; }
			.stage-column { order: 1; }
			.stage { min-height: 430px; }
			.result-area { min-height: 290px; }
		}

		@media (max-width: 540px) {
			.app-shell { padding: 18px 12px 30px; }
			.topbar { align-items: flex-start; flex-direction: column; gap: 16px; }
			.masthead-line { width: 100%; gap: 8px; }
			.sound-toggle-button { gap: 4px; padding: 0 8px; font-size: 12px; }
			.mode-switch { display: grid; width: 100%; grid-template-columns: repeat(3, minmax(0, 1fr)); }
			.mode-button { flex: 1; }
			.mode-button { padding: 0 5px; font-size: 13px; }
			.stage { min-height: 370px; padding: 20px 16px; border-radius: 14px; }
			.stage-topline { font-size: 12px; }
			.result-area { min-height: 245px; padding: 22px 0; }
			.result-tile { width: min(42vw, 160px); min-height: min(42vw, 160px); border-radius: 18px; font-size: clamp(42px, 13vw, 68px); }
			.result-tile.name-tile { width: 100%; min-height: 98px; font-size: 32px; }
			.result-tile.has-image { min-height: 185px; font-size: 24px; }
			.result-tile.name-tile.has-image { min-height: 210px; font-size: 20px; }
			.result-tile-image { width: min(100%, 120px); }
			.group-results { grid-template-columns: 1fr; }
			.stage-footer { align-items: flex-start; flex-direction: column; }
			.control-panel { padding: 19px 16px; }
			.range-entry { grid-template-columns: minmax(0, 1fr) 16px minmax(0, 1fr) 44px; gap: 5px; }
			.add-range-button { width: 44px; }
			.history-panel { padding: 17px 15px; }
			.history-item { grid-template-columns: 88px 1fr; gap: 9px; }
		}

		@media (max-width: 600px) and (orientation: portrait) {
			.app-shell { display: grid; grid-template-columns: minmax(0, 1fr); row-gap: 12px; }
			.topbar { display: contents; }
			.masthead-line { grid-column: 1; grid-row: 1; }
			.brand { min-width: 0; }
			.brand > div:last-child { min-width: 0; }
			.brand p { overflow-wrap: anywhere; }
			.mode-switch { grid-column: 1; grid-row: 2; width: 100%; margin: 0; }
			.workspace { display: contents; }
			.control-panel { padding: 0; }
			.control-panel { grid-column: 1; grid-row: 3; margin: 0; order: unset; }
			.stage-column { grid-column: 1; grid-row: 4; order: unset; }
			.settings-disclosure:not([open]) > .settings-content { display: none; }
			.settings-summary { min-height: 58px; padding: 16px; }
			.settings-summary .panel-heading { margin: 0; }
			.settings-chevron { margin: 0 4px 5px 0; }
			.settings-content { padding: 0 16px 18px; }
			.settings-disclosure[open] > .settings-summary { border-bottom: 1px solid #edf1ed; }
			.settings-disclosure[open] > .settings-content { padding-top: 16px; }
			.control-panel > .draw-button { width: calc(100% - 32px); margin: 0 16px 12px; }
			.control-panel > .available-count { margin: 0 16px 13px; }
			.control-panel > .error-message { margin: 12px 16px 16px; }
			.range-entry { gap: 4px; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; }
		}
	</style>
</head>
<body>
	<!-- 頁首與模式切換，兩種模式共用同一套抽籤流程。 -->
	<div class="app-shell">
		<header class="topbar">
			<div class="masthead-line">
				<div class="brand">
					<div class="brand-mark" aria-hidden="true"><img class="brand-mark-image" src="libraries/扭蛋機-icon.png" alt=""></div>
					<div>
						<h1>課堂抽籤機</h1>
						<p>讓每一次回答，都公平又有趣</p>
					</div>
				</div>
				<button class="sound-toggle-button" id="sound-toggle-button" type="button" aria-pressed="true" aria-label="關閉音效">
					<span class="sound-toggle-icon" aria-hidden="true">♫</span>
					<span id="sound-toggle-label">音效：開</span>
				</button>
			</div>
			<nav class="mode-switch" aria-label="抽籤模式">
				<button class="mode-button" id="number-mode-button" type="button" aria-pressed="true">號碼模式</button>
				<button class="mode-button" id="name-mode-button" type="button" aria-pressed="false">姓名模式</button>
				<button class="mode-button" id="groups-mode-button" type="button" aria-pressed="false">隨機分組</button>
			</nav>
		</header>

		<main class="workspace">
			<!-- 左側設定：候選名單、排除條件與抽取選項。 -->
			<aside class="control-panel" aria-label="抽籤設定與操作">
				<details class="settings-disclosure" id="settings-panel" open>
				<summary class="settings-summary">
					<h2 class="panel-heading" id="settings-title">抽籤設定</h2>
					<span class="settings-chevron" aria-hidden="true"></span>
				</summary>
				<div class="settings-content">
				<div class="field" id="group-source-panel" hidden>
					<div class="field-label-row"><span class="field-label">名單來源</span></div>
					<div class="group-source-switch" role="group" aria-label="分組名單來源">
						<button class="group-source-button" id="group-number-source" type="button" aria-pressed="true">號碼模式</button>
						<button class="group-source-button" id="group-name-source" type="button" aria-pressed="false">姓名模式</button>
					</div>
				</div>

				<section class="field" id="number-panel" aria-label="號碼範圍設定">
					<div class="field-label-row">
						<label class="field-label" for="range-start">號碼範圍</label>
						<span class="field-hint">可新增多組</span>
					</div>
					<div class="range-entry">
						<input class="number-input" id="range-start" type="number" inputmode="numeric" value="1" aria-label="起始號碼">
						<span aria-hidden="true">至</span>
						<input class="number-input" id="range-end" type="number" inputmode="numeric" value="15" aria-label="結束號碼">
						<button class="add-range-button" id="add-range-button" type="button" aria-label="新增號碼範圍" title="新增範圍">+</button>
					</div>
					<div class="range-list" id="range-list" aria-live="polite"></div>
				</section>

				<section class="field" id="name-panel" hidden>
					<div class="field-label-row">
						<label class="field-label" for="name-list">班級名單</label>
						<span class="field-hint">每行一個姓名</span>
					</div>
					<textarea class="name-list" id="name-list" placeholder="王小明&#10;林小華&#10;陳同學" spellcheck="false"></textarea>
				</section>

				<section id="group-panel" hidden>
					<div class="field">
						<label class="field-label" for="group-size">每組人數</label>
						<div class="quantity-row">
							<input class="number-input" id="group-size" type="number" min="1" step="1" value="4" inputmode="numeric">
							<span class="quantity-caption">位</span>
						</div>
					</div>
					<div class="field">
						<div class="field-label-row"><span class="field-label">分組方式</span></div>
						<div class="group-strategies" role="group" aria-label="分組方式">
							<button class="strategy-button" type="button" data-group-strategy="random" aria-pressed="true">純隨機</button>
							<button class="strategy-button" type="button" data-group-strategy="mixed" aria-pressed="false">男女混合</button>
							<button class="strategy-button" type="button" data-group-strategy="separate" aria-pressed="false">男女分開</button>
						</div>
						<p class="field-hint" id="group-strategy-hint" style="margin: 8px 0 0;">不依性別分類，隨機平均分組</p>
					</div>
				</section>

				<div class="field">
					<label class="field-label" for="exclude-input">排除對象</label>
					<input class="text-input" id="exclude-input" type="text" placeholder="例如：5, 12" autocomplete="off">
					<div class="field-hint" id="exclude-hint" style="margin-top: 7px;">輸入要排除的號碼，可用逗號分隔</div>
				</div>

				<div class="field" id="draw-options-panel">
					<label class="field-label" for="draw-count">一次抽出</label>
					<div class="quantity-row">
						<input class="number-input" id="draw-count" type="number" min="1" step="1" value="1" inputmode="numeric">
						<span class="quantity-caption">位</span>
					</div>
				</div>

				<div class="switch-row" id="repeat-options-panel">
					<div class="switch-copy">
						<strong>不重複抽籤</strong>
						<small>抽過的對象不再入選</small>
					</div>
					<label class="toggle">
						<span class="visually-hidden">開啟不重複抽籤</span>
						<input id="no-repeat-toggle" type="checkbox" checked>
						<span class="toggle-track" aria-hidden="true"></span>
					</label>
				</div>
				</div>
				</details>

				<button class="draw-button" id="draw-button" type="button">
					<span class="draw-icon" aria-hidden="true">✦</span>
					<span id="draw-button-label">開始抽籤</span>
				</button>
				<p class="available-count" id="available-count" aria-live="polite"></p>
				<p class="error-message" id="error-message" role="alert" hidden></p>
			</aside>

			<!-- 右側結果舞台，使用大字與高對比方便教室投影。 -->
			<section class="stage-column" aria-label="抽籤結果與紀錄">
				<div class="stage">
					<div class="stage-topline">
						<span class="live-indicator"><span class="live-dot" aria-hidden="true"></span><span>抽籤結果</span></span>
						<span id="stage-mode-label">號碼模式</span>
					</div>
					<div class="result-area" id="result-area" aria-live="assertive" aria-atomic="true">
						<div class="result-placeholder">
							<span class="placeholder-symbol" aria-hidden="true">✳</span>
							<p class="placeholder-title">準備好了嗎？</p>
							<p class="placeholder-copy">按下「開始抽籤」，揭曉幸運名單</p>
						</div>
					</div>
					<button class="all-leaders-button" id="all-leaders-button" type="button" hidden>每組各抽一位組長</button>
					<div class="stage-footer">
						<span id="result-caption">每個人都有被選中的機會</span>
						<span>課堂公平小幫手</span>
					</div>
				</div>

				<section class="history-panel" aria-labelledby="history-title">
					<div class="history-heading">
						<h2 id="history-title">抽籤紀錄</h2>
						<div class="history-actions">
							<button class="reset-button" id="export-history-button" type="button" disabled>匯出 CSV</button>
							<button class="reset-button" id="reset-button" type="button">重置抽籤紀錄</button>
						</div>
					</div>
					<p class="history-empty" id="history-empty">還沒有抽籤紀錄</p>
					<div class="history-list" id="history-list"></div>
				</section>
			</section>
		</main>
	</div>

	<!-- 彩帶畫布獨立於版面，不影響按鈕操作。 -->
	<canvas id="confetti-canvas" aria-hidden="true"></canvas>

	<script>
		// 使用固定的儲存鍵保存名單與抽籤狀態，讀取失敗時仍可正常使用。
		const STORAGE_KEYS = {
			names: "classroom-draw-names-v1",
			state: "classroom-draw-state-v1",
			sound: "classroom-draw-sound-v1"
		};
		const PROFILE_IMAGE_SOURCES = {
			male: { directory: "libraries/大頭貼(男）", first: 1, last: 17 },
			female: { directory: "libraries/大頭貼 (女)", first: 18, last: 35 }
		};

		const elements = {
			numberModeButton: document.querySelector("#number-mode-button"),
			nameModeButton: document.querySelector("#name-mode-button"),
			groupsModeButton: document.querySelector("#groups-mode-button"),
			soundToggleButton: document.querySelector("#sound-toggle-button"),
			soundToggleLabel: document.querySelector("#sound-toggle-label"),
			groupNumberSource: document.querySelector("#group-number-source"),
			groupNameSource: document.querySelector("#group-name-source"),
			numberPanel: document.querySelector("#number-panel"),
			namePanel: document.querySelector("#name-panel"),
			groupSourcePanel: document.querySelector("#group-source-panel"),
			groupPanel: document.querySelector("#group-panel"),
			rangeStart: document.querySelector("#range-start"),
			rangeEnd: document.querySelector("#range-end"),
			addRangeButton: document.querySelector("#add-range-button"),
			rangeList: document.querySelector("#range-list"),
			nameList: document.querySelector("#name-list"),
			excludeInput: document.querySelector("#exclude-input"),
			excludeHint: document.querySelector("#exclude-hint"),
			drawCount: document.querySelector("#draw-count"),
			drawOptionsPanel: document.querySelector("#draw-options-panel"),
			repeatOptionsPanel: document.querySelector("#repeat-options-panel"),
			groupSize: document.querySelector("#group-size"),
			groupStrategyButtons: [...document.querySelectorAll("[data-group-strategy]")],
			groupStrategyHint: document.querySelector("#group-strategy-hint"),
			noRepeatToggle: document.querySelector("#no-repeat-toggle"),
			drawButton: document.querySelector("#draw-button"),
			drawButtonLabel: document.querySelector("#draw-button-label"),
			availableCount: document.querySelector("#available-count"),
			errorMessage: document.querySelector("#error-message"),
			settingsPanel: document.querySelector("#settings-panel"),
			settingsContent: document.querySelector(".settings-content"),
			stageModeLabel: document.querySelector("#stage-mode-label"),
			resultArea: document.querySelector("#result-area"),
			resultCaption: document.querySelector("#result-caption"),
			historyEmpty: document.querySelector("#history-empty"),
			historyList: document.querySelector("#history-list"),
			exportHistoryButton: document.querySelector("#export-history-button"),
			resetButton: document.querySelector("#reset-button"),
			allLeadersButton: document.querySelector("#all-leaders-button"),
			confettiCanvas: document.querySelector("#confetti-canvas")
		};

		// 儲存範圍採整數端點；紀錄與已抽對象也會在重新整理後保留。
		const state = {
			mode: "number",
			soundEnabled: readStorage(STORAGE_KEYS.sound, "true") !== "false",
			sourceMode: "number",
			groupStrategy: "random",
			groups: [],
			ranges: [{ start: 1, end: 15 }],
			history: [],
			drawn: [],
			spinning: false
		};

		let spinTimer = null;
		let spinAudio = null;
		let revealAudio = null;
		let confettiFrame = null;

		// localStorage 在隱私瀏覽或檔案網址環境可能不可用，因此所有操作都防護例外。
		function readStorage(key, fallback) {
			try {
				const value = localStorage.getItem(key);
				return value === null ? fallback : value;
			} catch (error) {
				return fallback;
			}
		}

		function writeStorage(key, value) {
			try {
				localStorage.setItem(key, value);
			} catch (error) {
				// 儲存空間不可用時，抽籤仍可在目前頁面工作。
			}
		}

		// 將使用者內容轉成安全文字，避免姓名被當成 HTML 插入頁面。
		function escapeHtml(value) {
			return String(value).replace(/[&<>"']/g, (character) => ({
				"&": "&amp;",
				"<": "&lt;",
				">": "&gt;",
				'"': "&quot;",
				"'": "&#39;"
			})[character]);
		}

		function showError(message) {
			elements.errorMessage.textContent = message;
			elements.errorMessage.hidden = !message;
		}

		// 同步音效按鈕的可見文字與無障礙狀態。
		function updateSoundButton() {
			elements.soundToggleButton.setAttribute("aria-pressed", String(state.soundEnabled));
			elements.soundToggleButton.setAttribute("aria-label", state.soundEnabled ? "關閉音效" : "開啟音效");
			elements.soundToggleLabel.textContent = state.soundEnabled ? "音效：開" : "音效：關";
		}

		// 收合設定時直接隱藏內容與抽籤按鈕，避免瀏覽器樣式差異造成按鈕外露。
		function syncSettingsPanel() {
			const isOpen = elements.settingsPanel.open;
			elements.settingsContent.hidden = !isOpen;
		}

		// 將抽籤狀態與名單分開儲存，重置紀錄時不會刪除老師的名單。
		function saveState() {
			writeStorage(STORAGE_KEYS.state, JSON.stringify({
				ranges: state.ranges,
				history: state.history,
				drawn: state.drawn
			}));
		}

		function restoreState() {
			const savedNames = readStorage(STORAGE_KEYS.names, "");
			elements.nameList.value = savedNames;

			try {
				const savedState = JSON.parse(readStorage(STORAGE_KEYS.state, "{}"));
				if (Array.isArray(savedState.ranges) && savedState.ranges.length) {
					state.ranges = savedState.ranges.filter((range) => Number.isInteger(range.start) && Number.isInteger(range.end) && range.end >= range.start);
					if (!state.ranges.length) state.ranges = [{ start: 1, end: 15 }];
				}
				if (Array.isArray(savedState.history)) state.history = savedState.history.slice(0, 50);
				if (Array.isArray(savedState.drawn)) state.drawn = savedState.drawn;
			} catch (error) {
				state.history = [];
				state.drawn = [];
			}
		}

		function renderRanges() {
			elements.rangeList.innerHTML = state.ranges.map((range, index) => `
				<span class="range-chip">
					${range.start}～${range.end}
					<button class="chip-remove" type="button" data-remove-range="${index}" aria-label="移除 ${range.start} 到 ${range.end} 範圍">×</button>
				</span>
			`).join("");
		}

		// 依目前模式整理候選人；相同姓名只保留一個，避免抽中同一個文字兩次。
		function getCandidates() {
			const sourceMode = state.mode === "groups" ? state.sourceMode : state.mode;
			if (sourceMode === "name") {
				const names = elements.nameList.value.split(/\r?\n/).map((name) => name.trim()).filter(Boolean);
				return [...new Set(names)].map((name) => ({ key: name, label: name }));
			}

			const numbers = new Set();
			state.ranges.forEach(({ start, end }) => {
				for (let number = start; number <= end; number += 1) numbers.add(number);
			});
			return [...numbers].sort((first, second) => first - second).map((number) => ({
				key: String(number),
				label: String(number)
			}));
		}

		// 排除條件接受逗號、頓號、分號或換行，號碼也可用 5-8 表示一段範圍。
		function getExcludedValues() {
			const parts = elements.excludeInput.value.split(/[,，、;；\n]+/).map((part) => part.trim()).filter(Boolean);
			const excluded = new Set();

			const sourceMode = state.mode === "groups" ? state.sourceMode : state.mode;
			if (sourceMode === "name") {
				parts.forEach((part) => excluded.add(part));
				return excluded;
			}

			parts.forEach((part) => {
				const match = part.match(/^(\d+)\s*(?:-|~|～|至)\s*(\d+)$/);
				if (match) {
					const start = Number(match[1]);
					const end = Number(match[2]);
					if (end >= start && end - start <= 10000) {
						for (let number = start; number <= end; number += 1) excluded.add(String(number));
					}
				} else if (/^\d+$/.test(part)) {
					excluded.add(String(Number(part)));
				}
			});
			return excluded;
		}

		function getAvailableCandidates() {
			const excluded = getExcludedValues();
			const drawn = new Set(state.drawn);
			return getCandidates().filter((candidate) => {
				if (excluded.has(candidate.key)) return false;
				return !elements.noRepeatToggle.checked || !drawn.has(candidate.key);
			});
		}

		// 解析姓名尾端的性別標記，並依指定號碼規則辨識男女。
		function getGroupingCandidates() {
			const sourceMode = state.mode === "groups" ? state.sourceMode : state.mode;
			const excluded = getExcludedValues();
			return getCandidates().map((candidate) => {
				if (sourceMode === "name") {
					const match = candidate.label.match(/^(.*?)\s*[（(](男|女)[）)]\s*$/);
					return {
						...candidate,
						label: match ? match[1].trim() : candidate.label,
						gender: match ? (match[2] === "男" ? "male" : "female") : "unknown"
					};
				}

				const number = Number(candidate.key);
				return {
					...candidate,
					gender: number >= 1 && number <= 15 ? "male" : number >= 21 && number <= 33 ? "female" : "unknown"
				};
			}).filter((candidate) => !excluded.has(candidate.key) && !excluded.has(candidate.label));
		}

		function getCandidateGender(candidate) {
			if (candidate.gender === "male" || candidate.gender === "female") return candidate.gender;
			const sourceMode = state.mode === "groups" ? state.sourceMode : state.mode;
			if (sourceMode === "number") {
				const number = Number(candidate.key);
				if (number >= 1 && number <= 15) return "male";
				if (number >= 21 && number <= 33) return "female";
				return null;
			}

			const match = candidate.label.match(/[（(](男|女)[）)]\s*$/);
			return match ? (match[1] === "男" ? "male" : "female") : null;
		}

		function getProfileImagePath(candidate) {
			const gender = getCandidateGender(candidate);
			const source = PROFILE_IMAGE_SOURCES[gender];
			if (!source) return null;
			const imageNumber = source.first + Math.floor(Math.random() * (source.last - source.first + 1));
			return `${source.directory}/${imageNumber}.jpg`;
		}

		// 同步剩餘人數、模式提示及抽籤按鈕狀態。
		function updateAvailability() {
			const available = state.mode === "groups" ? getGroupingCandidates().length : getAvailableCandidates().length;
			const label = state.mode === "groups" ? "參與分組" : elements.noRepeatToggle.checked ? "剩餘可抽" : "目前可抽";
			elements.availableCount.textContent = `${label} ${available} 位`;
			elements.stageModeLabel.textContent = state.mode === "groups" ? "隨機分組" : state.mode === "number" ? "號碼模式" : "姓名模式";
			elements.drawButton.disabled = state.spinning;
			elements.drawButtonLabel.textContent = state.spinning ? "抽籤中…" : state.mode === "groups" ? "開始分組" : "開始抽籤";
			elements.allLeadersButton.hidden = state.groups.length === 0;
		}

		// 同步分組面板內來源按鈕的選取狀態。
		function updateGroupSourceControls() {
			elements.groupNumberSource.setAttribute("aria-pressed", String(state.sourceMode === "number"));
			elements.groupNameSource.setAttribute("aria-pressed", String(state.sourceMode === "name"));
		}

		// 分組時可直接切換名單來源，並顯示相對應的號碼或姓名輸入區。
		function setGroupSource(sourceMode) {
			state.sourceMode = sourceMode;

		function renderResults(values, spinning = false) {
			const resultGrid = document.createElement("div");
			resultGrid.className = `result-grid${spinning ? " is-spinning" : ""}`;
			resultGrid.setAttribute("aria-label", spinning ? "抽籤中" : "抽出結果");

		function renderHistory() {
			elements.historyEmpty.hidden = state.history.length > 0;
			elements.exportHistoryButton.disabled = state.history.length === 0;
			elements.historyList.innerHTML = state.history.map((entry) => {
				const date = new Date(entry.time);
				const time = Number.isNaN(date.getTime()) ? "" : date.toLocaleString("zh-TW", {
					month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false
				});
				return `<div class="history-item"><time class="history-time">${escapeHtml(time)}</time><span class="history-values">${entry.values.map(escapeHtml).join("、")}</span></div>`;

		}

		// 將每個 CSV 欄位用雙引號包覆，並把內含雙引號加倍跳脫。
		function escapeCsvField(value) {
			return `"${String(value ?? "").replace(/"/g, '""')}"`;
		}

		// 以 UTF-8 BOM 匯出完整紀錄，協助常見試算表正確辨識繁體中文。
		function exportHistoryCsv() {
			if (!state.history.length) return;

			const modeLabels = { number: "號碼模式", name: "姓名模式", groups: "隨機分組" };
			const rows = [
				["時間", "模式", "抽出名單"],
				...state.history.map((entry) => [
					entry.time,
					modeLabels[entry.mode] || entry.mode || "",
					Array.isArray(entry.values) ? entry.values.join("、") : ""
				])
			];
			const csv = `\uFEFF${rows.map((row) => row.map(escapeCsvField).join(",")).join("\r\n")}`;
			const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
			const objectUrl = URL.createObjectURL(blob);
			const downloadLink = document.createElement("a");
			downloadLink.href = objectUrl;
			downloadLink.download = `抽籤紀錄_${new Date().toISOString().slice(0, 10)}.csv`;
			document.body.append(downloadLink);
			downloadLink.click();
			downloadLink.remove();
			window.setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
		}

		function randomSample(items, count) {
			const pool = [...items];
			const results = [];
			for (let index = 0; index < count; index += 1) {
				const chosenIndex = Math.floor(Math.random() * pool.length);
				results.push(pool.splice(chosenIndex, 1)[0]);
			}
			return results;
		}

		// Fisher-Yates 洗牌讓每個候選人的排列機率相同。
		function shuffle(items) {
			const shuffled = [...items];
			for (let index = shuffled.length - 1; index > 0; index -= 1) {
				const swapIndex = Math.floor(Math.random() * (index + 1));
				[shuffled[index], shuffled[swapIndex]] = [shuffled[swapIndex], shuffled[index]];
			}
			return shuffled;
		}

		function makeRandomGroups(candidates, groupSize) {
			const shuffled = shuffle(candidates);
			const groups = [];
			for (let index = 0; index < shuffled.length; index += groupSize) {
				groups.push({ title: `第 ${groups.length + 1} 組`, members: shuffled.slice(index, index + groupSize), leaderKey: null });
			}
			return groups;
		}

		// 分別平均散布各性別，再以組內人數作次要條件避免組別大小失衡。
		function makeMixedGroups(candidates, groupSize) {
			const groupCount = Math.ceil(candidates.length / groupSize);
			const groups = Array.from({ length: groupCount }, (_, index) => ({
				title: `第 ${index + 1} 組`, members: [], leaderKey: null
			}));

			["male", "female", "unknown"].forEach((gender) => {
				shuffle(candidates.filter((candidate) => candidate.gender === gender)).forEach((candidate) => {
					const availableGroups = groups.filter((group) => group.members.length < groupSize);
					const fewestSameGender = Math.min(...availableGroups.map((group) => group.members.filter((member) => member.gender === gender).length));
					const genderBalanced = availableGroups.filter((group) => group.members.filter((member) => member.gender === gender).length === fewestSameGender);
					const smallestGroup = Math.min(...genderBalanced.map((group) => group.members.length));
					const balancedGroups = genderBalanced.filter((group) => group.members.length === smallestGroup);
					balancedGroups[Math.floor(Math.random() * balancedGroups.length)].members.push(candidate);
				});
			});
			return groups;
		}

		function makeSeparateGroups(candidates, groupSize) {
			const groups = [];
			[["male", "男生"], ["female", "女生"], ["unknown", "未標示"]].forEach(([gender, label]) => {
				const members = shuffle(candidates.filter((candidate) => candidate.gender === gender));
				for (let index = 0; index < members.length; index += groupSize) {
					groups.push({
						title: `${label}第 ${Math.floor(index / groupSize) + 1} 組`,
						members: members.slice(index, index + groupSize),
						leaderKey: null
					});
				}
			});
			return groups;
		}

		// 依分組策略建立卡片內容並更新無性別標記對象的辨識提示。
		function startGrouping() {
			showError("");
			const candidates = getGroupingCandidates();
			const groupSize = Number(elements.groupSize.value);
			if (!Number.isInteger(groupSize) || groupSize < 1) {
				showError("每組人數請輸入至少 1 位的整數。");
				return;
			}
			if (!candidates.length) {
				showError("目前沒有可分組的對象，請檢查名單、號碼範圍或排除設定。");
				return;
			}

			if (state.groupStrategy === "mixed") state.groups = makeMixedGroups(candidates, groupSize);
			else if (state.groupStrategy === "separate") state.groups = makeSeparateGroups(candidates, groupSize);
			else state.groups = makeRandomGroups(candidates, groupSize);
			renderGroupResults();
			updateAvailability();
		}

		// 用 DOM 節點建立分組卡片，安全呈現名單並醒目標示性別與組長。
		function renderGroupResults() {
			const groupResults = document.createElement("div");
			groupResults.className = "group-results";
			state.groups.forEach((group, groupIndex) => {
				const card = document.createElement("article");
				card.className = "group-card";
				const heading = document.createElement("div");
				heading.className = "group-card-heading";
				const title = document.createElement("h3");
				title.textContent = group.title;
				const count = document.createElement("span");
				count.textContent = `${group.members.length} 位`;
				heading.append(title, count);

				const memberList = document.createElement("ul");
				memberList.className = "group-members";
				group.members.forEach((member) => {
					const item = document.createElement("li");
					item.className = `group-member${group.leaderKey === member.key ? " is-leader" : ""}`;
					if (!Object.hasOwn(member, "profileImagePath")) member.profileImagePath = getProfileImagePath(member);
					const imagePath = member.profileImagePath;
					if (imagePath) {
						const image = document.createElement("img");
						image.className = "group-member-photo";
						image.src = imagePath;
						image.alt = `${member.label} 的大頭貼`;
						image.onerror = () => image.remove();
						item.append(image);
					}
					const name = document.createElement("span");
					name.className = "member-name";
					name.textContent = member.label;
					const tags = document.createElement("span");
					tags.className = "member-tags";
					if (member.gender !== "unknown") {
						const gender = document.createElement("span");
						gender.className = "gender-badge";
						gender.textContent = member.gender === "male" ? "男" : "女";
						tags.append(gender);
					} else if (state.groupStrategy !== "random") {
						const unknown = document.createElement("span");
						unknown.className = "gender-badge";
						unknown.textContent = "未標示";
						tags.append(unknown);
					}
					if (group.leaderKey === member.key) {
						const leader = document.createElement("span");
						leader.className = "leader-badge";
						leader.textContent = "組長";
						tags.append(leader);
					}
					item.append(name, tags);
					memberList.append(item);
				});

				const leaderButton = document.createElement("button");
				leaderButton.className = "group-leader-button";
				leaderButton.type = "button";
				leaderButton.dataset.leaderIndex = String(groupIndex);
				leaderButton.textContent = group.leaderKey ? "重新抽選本組組長" : "抽一位組長";
				card.append(heading, memberList, leaderButton);
				groupResults.append(card);
			});
			elements.resultArea.replaceChildren(groupResults);
			elements.resultCaption.textContent = `共 ${getGroupingCandidates().length} 位，分成 ${state.groups.length} 組`;
			elements.allLeadersButton.hidden = state.groups.length === 0;
		}

		function chooseGroupLeader(groupIndex) {
			const group = state.groups[groupIndex];
			if (!group || !group.members.length) return;
			group.leaderKey = group.members[Math.floor(Math.random() * group.members.length)].key;
			renderGroupResults();
		}

		// 一次獨立抽選每組組長，同組內不會重複標示多位組長。
		function chooseAllGroupLeaders() {
			state.groups.forEach((group) => {
				if (group.members.length) group.leaderKey = group.members[Math.floor(Math.random() * group.members.length)].key;
			});
			renderGroupResults();
		}

		function startSpinSound() {
			if (!state.soundEnabled) return;

				spinAudio = new Audio("libraries/メッセージ表示音3.mp3");
				spinAudio.loop = true;

		function stopSpinSound() {
			if (!spinAudio) return;

		function playRevealSound() {

		// 使用 Canvas 繪製短暫彩帶，無需圖片、套件或網路資源。
		function launchConfetti() {
			const canvas = elements.confettiCanvas;
			const context = canvas.getContext("2d");
			if (!context) return;

			if (confettiFrame) cancelAnimationFrame(confettiFrame);
			const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
			canvas.width = Math.floor(window.innerWidth * pixelRatio);
			canvas.height = Math.floor(window.innerHeight * pixelRatio);
			context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

			const colors = ["#176b58", "#e66c4e", "#f2c65e", "#6ca5d4", "#83bd8c"];
			const particles = Array.from({ length: 115 }, () => ({
				x: Math.random() * window.innerWidth,
				y: -20 - Math.random() * window.innerHeight * 0.35,
				width: 5 + Math.random() * 8,
				height: 7 + Math.random() * 8,
				speed: 2.2 + Math.random() * 3.6,
				drift: (Math.random() - 0.5) * 2.4,
				rotation: Math.random() * Math.PI,
				spin: (Math.random() - 0.5) * 0.16,
				color: colors[Math.floor(Math.random() * colors.length)]
			}));
			const startedAt = performance.now();

			function drawFrame(now) {
				context.clearRect(0, 0, window.innerWidth, window.innerHeight);
				particles.forEach((particle) => {
					particle.x += particle.drift;
					particle.y += particle.speed;
					particle.rotation += particle.spin;
					context.save();
					context.translate(particle.x, particle.y);
					context.rotate(particle.rotation);
					context.fillStyle = particle.color;
					context.fillRect(-particle.width / 2, -particle.height / 2, particle.width, particle.height);
					context.restore();
				});

				if (now - startedAt < 2400) {
					confettiFrame = requestAnimationFrame(drawFrame);
				} else {
					context.clearRect(0, 0, window.innerWidth, window.innerHeight);
					confettiFrame = null;
				}
			}

			confettiFrame = requestAnimationFrame(drawFrame);
		}

		// 抽籤前檢查候選人數與抽取數量，錯誤只顯示提示，不中斷頁面。
		function startDraw() {
			if (state.spinning) return;
			if (state.mode === "groups") {
				startGrouping();
				return;
			}
			showError("");

			const available = getAvailableCandidates();
			const requestedCount = Number(elements.drawCount.value);
			if (!Number.isInteger(requestedCount) || requestedCount < 1) {
				showError("請輸入至少 1 位的抽籤人數。");
				elements.drawCount.focus();
				return;
			}
			if (available.length === 0) {
				showError("目前沒有可抽對象。請檢查名單、號碼範圍或排除設定。");
				return;
			}
			if (requestedCount > available.length) {
				showError(`目前只有 ${available.length} 位可抽，無法一次抽出 ${requestedCount} 位。請調整人數或排除條件。`);
				return;
			}

			state.spinning = true;
			updateAvailability();
			startSpinSound();
			const finishAt = Date.now() + 2000;
			spinTimer = window.setInterval(() => {
				const preview = randomSample(available, requestedCount).map((candidate) => candidate.label);
				renderResults(preview, true);

				if (Date.now() >= finishAt) {
					window.clearInterval(spinTimer);
					spinTimer = null;
					stopSpinSound();
					finishDraw(randomSample(available, requestedCount));
				}
			}, 75);
		}

		function finishDraw(selected) {
			const values = selected.map((candidate) => candidate.label);
			state.spinning = false;
			state.drawn = [...new Set([...state.drawn, ...selected.map((candidate) => candidate.key)])];
			state.history.unshift({ time: new Date().toISOString(), mode: state.mode, values });
			state.history = state.history.slice(0, 50);
			saveState();
			renderResults(selected);
			renderHistory();
			updateAvailability();
			playRevealSound();
			launchConfetti();
		}

		// 切換模式時保留兩種名單內容，只切換目前使用的候選來源。
		function setMode(mode) {
			if (mode !== "groups") state.sourceMode = mode;
			state.mode = mode;
			const sourceMode = mode === "groups" ? state.sourceMode : mode;
			const isNumberMode = sourceMode === "number";
			elements.numberModeButton.setAttribute("aria-pressed", String(mode === "number"));
			elements.nameModeButton.setAttribute("aria-pressed", String(mode === "name"));
			elements.groupsModeButton.setAttribute("aria-pressed", String(mode === "groups"));
			updateGroupSourceControls();
			elements.numberPanel.hidden = !isNumberMode;
			elements.namePanel.hidden = isNumberMode;
			elements.groupSourcePanel.hidden = mode !== "groups";
			elements.groupPanel.hidden = mode !== "groups";
			elements.drawOptionsPanel.hidden = mode === "groups";
			elements.repeatOptionsPanel.hidden = mode === "groups";
			elements.excludeInput.placeholder = isNumberMode ? "例如：5, 12" : "例如：王小明、林小華";
			elements.excludeHint.textContent = isNumberMode
				? "輸入要排除的號碼，可用逗號分隔"
				: "輸入要排除的姓名，可用逗號或換行分隔";
			state.groups = [];
			elements.resultCaption.textContent = "每個人都有被選中的機會";
			elements.resultArea.innerHTML = `
				<div class="result-placeholder">
					<span class="placeholder-symbol" aria-hidden="true">✳</span>
					<p class="placeholder-title">準備好了嗎？</p>
					<p class="placeholder-copy">按下「開始抽籤」，揭曉幸運名單</p>
				</div>
			`;
			showError("");
			updateAvailability();
		}

		// 新增多組號碼範圍時驗證整數、順序與合理範圍大小。
		function addRange() {
			const start = Number(elements.rangeStart.value);
			const end = Number(elements.rangeEnd.value);
			if (!Number.isInteger(start) || !Number.isInteger(end)) {
				showError("起始號碼與結束號碼都必須是整數。");
				return;
			}
			if (end < start) {
				showError("結束號碼不能小於起始號碼。");
				return;
			}
			if (end - start > 9999) {
				showError("單一號碼範圍最多可包含 10,000 個號碼。");
				return;
			}

			state.ranges.push({ start, end });
			renderRanges();
			saveState();
			showError("");
			updateAvailability();
		}

					<p class="placeholder-copy">按下「開始抽籤」，揭曉幸運名單</p>
				</div>
			`;
			elements.resultCaption.textContent = "每個人都有被選中的機會";
			showError("");
			updateAvailability();
		});

		// 載入保存內容並繪製初始畫面。
		restoreState();
		renderRanges();
		renderHistory();
		updateSoundButton();
		syncSettingsPanel();
		updateAvailability();
	</script>
</body>
